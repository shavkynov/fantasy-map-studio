<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fantasy Map Studio</title>
<style>
  :root {
    --bg: #161513;
    --glass: rgba(24, 23, 21, 0.84);
    --glass-strong: rgba(22, 21, 19, 0.94);
    --border: rgba(255, 245, 228, 0.12);
    --border-strong: rgba(255, 245, 228, 0.22);
    --text: #efe9dc;
    --muted: #a69d8e;
    --accent: #d39c4e;
    --accent-soft: rgba(211, 156, 78, 0.18);
    --danger: #d96b5b;
    --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* Full-bleed viewport */
  #viewport {
    position: fixed; inset: 0;
    overflow: hidden;
    cursor: grab;
    background: radial-gradient(circle at 50% 45%, #23211e 0%, #141311 100%);
  }
  #viewport.tool-road, #viewport.tool-marker { cursor: crosshair; }
  #viewport.panning { cursor: grabbing !important; }
  #panzoom {
    position: absolute; left: 0; top: 0;
    transform-origin: 0 0;
  }
  #map-stage {
    position: relative;
    line-height: 0;
  }
  #map-stage svg { display: block; }
  /* Под тайлами обзорный рисунок не виден — не тратим на него время. */
  #map-stage svg.tiled > :is(#layer-water-detail, #layer-ice, #layer-rivers, #layer-coast, #layer-relief,
    #layer-forests, #layer-currents, #layer-frame) { display: none; }

  /* Common floating glass surfaces */
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 8px;
    box-shadow: var(--shadow);
  }
  .popover, .modal-card, .float-card {
    background: var(--glass-strong);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
  }

  button {
    font: inherit;
    color: var(--text);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 5px 11px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    white-space: nowrap;
  }
  button:hover { background: rgba(255, 255, 255, 0.08); }
  button.active {
    background: var(--accent-soft);
    color: #f6dcb0;
    border-color: rgba(211, 156, 78, 0.45);
  }
  button.primary {
    background: var(--accent);
    color: #1a140b;
    font-weight: 600;
  }
  button.primary:hover { background: #dfab60; }
  button.subtle {
    border-color: var(--border);
    background: rgba(255, 255, 255, 0.04);
  }
  button.subtle:hover { background: rgba(255, 255, 255, 0.1); }
  button.icon-btn {
    padding: 5px 8px;
    min-width: 28px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .sep {
    width: 1px; height: 18px;
    background: var(--border);
    margin: 0 2px;
  }
  .seed-badge {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: #e6dcc8;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.05);
  }
  .civ-badge {
    font-size: 11.5px;
    color: var(--muted);
    margin-left: 4px;
  }
  .civ-badge.has-civ { color: #e8be7d; }

  /* Floating Top Bar */
  #topbar {
    position: fixed;
    top: 14px; left: 16px; right: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    pointer-events: none;
    z-index: 30;
  }
  #topbar > * { pointer-events: auto; }
  .bar-group {
    position: relative;
    display: flex; align-items: center; gap: 8px;
  }

  /* Popovers */
  .popover {
    position: absolute;
    top: calc(100% + 10px);
    width: 290px;
    padding: 14px;
    display: none;
    z-index: 40;
  }
  .popover.open { display: block; }
  .popover.right { right: 0; }
  .popover.center { left: 50%; transform: translateX(-50%); width: 320px; }
  .pop-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 10px 0;
  }
  .pop-sub {
    font-size: 12px;
    color: var(--muted);
    margin: -4px 0 10px 0;
  }
  .grid-2 {
    display: grid; grid-template-columns: 1fr 1fr; gap: 7px;
  }
  .chips {
    display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px;
  }
  .chips button {
    padding: 4px 9px; font-size: 12px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.03);
  }
  .chips button.active {
    background: var(--accent-soft);
    border-color: rgba(211, 156, 78, 0.55);
  }
  .btn-rect {
    border-radius: 9px;
    padding: 7px 10px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04);
    text-align: center;
    font-size: 12.5px;
  }
  .btn-rect:hover { background: rgba(255, 255, 255, 0.1); }
  .btn-rect.primary-soft {
    background: var(--accent-soft);
    border-color: rgba(211, 156, 78, 0.45);
    color: #f6dcb0;
    font-weight: 600;
  }
  .btn-rect.primary-soft:hover { background: rgba(211, 156, 78, 0.28); }
  .realms-list {
    margin-top: 10px;
    max-height: 175px;
    overflow-y: auto;
    border-top: 1px solid var(--border);
    padding-top: 8px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .realm-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 8px; border-radius: 8px;
    cursor: pointer; font-size: 12px;
  }
  .realm-item:hover { background: rgba(255, 255, 255, 0.07); }
  .swatch {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    margin-right: 7px; border: 1px solid rgba(255,255,255,0.25);
  }

  /* Layer checkboxes */
  .layers-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px;
  }
  label.chk {
    display: flex; align-items: center; gap: 7px;
    font-size: 12.5px; color: var(--text); cursor: pointer;
    padding: 2px 0;
  }
  label.chk input { accent-color: var(--accent); cursor: pointer; }

  /* Floating Bottom Dock */
  #dock-wrap {
    position: fixed;
    bottom: 16px; left: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    z-index: 30;
    pointer-events: none;
  }
  #dock-wrap > * { pointer-events: auto; }
  #tool-subbar {
    display: none;
    align-items: center; gap: 8px;
    padding: 5px 10px;
    font-size: 12px;
  }
  #tool-subbar.show { display: inline-flex; }
  #tool-subbar input[type="text"] {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text);
    padding: 4px 10px;
    font: inherit;
    font-size: 12px;
    width: 150px;
    outline: none;
  }
  #tool-subbar input[type="text"]:focus { border-color: var(--accent); }
  .road-status {
    color: #e8be7d;
    max-width: 280px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Bottom-Right Zoom & Legend Pill */
  #corner-controls {
    position: fixed;
    bottom: 16px; right: 16px;
    z-index: 30;
  }
  #zoom-pct {
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--muted);
    min-width: 40px;
    text-align: center;
  }

  /* Bottom-Left Floating Inspector Card */
  #inspect-card {
    position: fixed;
    bottom: 16px; left: 16px;
    width: 310px;
    max-height: calc(100vh - 96px);
    overflow-y: auto;
    padding: 14px;
    display: none;
    z-index: 30;
  }
  #inspect-card.open { display: block; }
  .card-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    margin-bottom: 10px;
  }
  .card-title { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .card-coords { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .kv {
    display: grid; grid-template-columns: 112px 1fr; gap: 4px 8px;
    font-size: 12px;
  }
  .kv .k { color: var(--muted); }
  .kv .v { color: var(--text); text-align: right; }
  details.res-details {
    margin-top: 10px;
    border-top: 1px solid var(--border);
    padding-top: 8px;
  }
  details.res-details summary {
    cursor: pointer; color: var(--muted); font-size: 12px; outline: none;
  }
  .res-bar {
    display: grid; grid-template-columns: 92px 1fr 34px; gap: 6px;
    align-items: center; margin-top: 6px; font-size: 11.5px;
  }
  .bar-track {
    height: 5px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%; background: var(--accent); border-radius: 999px;
  }

  /* New World Modal */
  #modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(10, 9, 8, 0.56);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center; justify-content: center;
    z-index: 50;
  }
  #modal-backdrop.open { display: flex; }
  .modal-card {
    width: 390px; max-width: calc(100vw - 32px);
    padding: 18px 20px;
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .modal-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .field { margin-bottom: 11px; }
  .field label {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--muted); margin-bottom: 5px;
  }
  .field input[type="text"], .field select {
    width: 100%;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border-strong);
    border-radius: 9px;
    color: var(--text);
    padding: 7px 10px;
    font: inherit;
    outline: none;
  }
  .field input[type="text"]:focus, .field select:focus { border-color: var(--accent); }
  .field input[type="range"] { width: 100%; accent-color: var(--accent); }
  details.phys-details {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 14px;
    background: rgba(255, 255, 255, 0.02);
  }
  details.phys-details summary {
    cursor: pointer; font-size: 12.5px; color: var(--muted);
  }
  .modal-actions {
    display: flex; justify-content: flex-end; gap: 8px;
  }

  /* Loading Banner */
  #loading-banner {
    position: fixed;
    top: 66px; left: 50%;
    transform: translateX(-50%);
    background: var(--glass-strong);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    color: var(--text);
    display: none; align-items: center; gap: 8px;
    box-shadow: var(--shadow);
    z-index: 60;
    pointer-events: none;
  }
  #loading-banner.show { display: inline-flex; }
  .spinner {
    width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-top-color: var(--accent);
    animation: spin 0.75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast Notification */
  #toast-banner {
    position: fixed;
    bottom: 72px; left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--glass-strong);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 8px 16px;
    font-size: 12.5px;
    color: var(--text);
    box-shadow: var(--shadow);
    z-index: 65;
    max-width: min(480px, 86vw);
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.16s ease, transform 0.16s ease;
  }
  #toast-banner.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Interactive SVG target animations */
  .wp-ring { cursor: pointer; transition: opacity 0.12s ease; }
  .wp-ring:hover { filter: brightness(1.18); }
  .settlement-icon { cursor: pointer; transition: opacity 0.12s ease; }
  .settlement-icon:hover { filter: brightness(1.18) drop-shadow(0 0 2px rgba(224,164,88,0.9)); }
  .card-actions { display: flex; gap: 6px; margin-top: 10px; }
  .card-actions button { flex: 1; font-size: 11.5px; padding: 6px 8px; }
  .wild-pill {
    display: inline-block; margin-top: 4px; padding: 2px 7px; border-radius: 6px;
    font-size: 10.5px; background: rgba(196, 118, 60, 0.18); border: 1px solid rgba(212, 146, 86, 0.35); color: #efb982;
  }
</style>
</head>
<body>

<div id="viewport">
  <div id="panzoom">
    <div id="map-stage"></div>
  </div>
</div>

<div id="loading-banner"><span class="spinner"></span><span id="loading-text">Генерация планеты...</span></div>
<div id="toast-banner" role="status" aria-live="polite"></div>

<!-- Floating Top Bar -->
<header id="topbar">
  <!-- Left Pill: World -->
  <div class="bar-group pill">
    <button id="badge-seed" class="seed-badge" title="Параметры мира">seed: e</button>
    <button id="btn-rand-seed" class="icon-btn" title="Случайный мир">🎲</button>
    <button id="btn-new-world" class="subtle">Новый мир…</button>
    <button id="btn-view-world" class="subtle">Весь мир</button>
  </div>

  <!-- Center Pill: Style + Civilization -->
  <div class="bar-group pill">
    <button id="btn-style-sepia" data-style="sepia" class="active">Сепия</button>
    <button id="btn-style-ink" data-style="ink">Ч/Б</button>
    <button id="btn-style-color" data-style="color">Цветной</button>
    <span class="sep"></span>
    <button id="btn-civ-menu">Цивилизация <span id="civ-badge" class="civ-badge">Природа</span></button>

    <div id="pop-civ" class="popover center">
      <div class="pop-title">Цивилизация и пути</div>
      <div id="civ-stats" class="pop-sub">Природный мир без государств</div>
      <div class="pop-title" style="margin-bottom:6px;">Количество держав</div>
      <div class="chips" id="realms-chips">
        <button data-realms="0" class="active">Авто</button>
        <button data-realms="4">4</button>
        <button data-realms="6">6</button>
        <button data-realms="8">8</button>
        <button data-realms="10">10</button>
        <button data-realms="12">12</button>
      </div>
      <div class="grid-2" style="margin-bottom:8px;">
        <button id="btn-civ-realms" class="btn-rect">Создать страны</button>
        <button id="btn-civ-cities" class="btn-rect">Создать города</button>
        <button id="btn-civ-routes" class="btn-rect">Дороги и моря</button>
        <button id="btn-civ-all" class="btn-rect primary-soft">Заселить всё</button>
      </div>
      <div class="grid-2">
        <button id="btn-civ-reroll" class="btn-rect">Перемешать</button>
        <button id="btn-civ-clear" class="btn-rect">Очистить</button>
      </div>
      <div id="realms-list" class="realms-list" style="display:none;"></div>
    </div>
  </div>

  <!-- Right Pill: Layers + Export -->
  <div class="bar-group pill">
    <button id="btn-layers-menu">Слои</button>
    <button id="btn-export-menu">Экспорт</button>

    <div id="pop-layers" class="popover right" style="width:310px;">
      <div class="pop-title">Видимые слои карты</div>
      <div class="layers-grid">
        <label class="chk"><input type="checkbox" data-layer="layer-rivers" checked />Реки и озёра</label>
        <label class="chk"><input type="checkbox" data-layer="layer-water-detail" checked />Штрихи воды</label>
        <label class="chk"><input type="checkbox" data-layer="layer-relief" checked />Горы и рельеф</label>
        <label class="chk"><input type="checkbox" data-layer="layer-forests" checked />Леса</label>
        <label class="chk"><input type="checkbox" data-layer="layer-ice" checked />Льды</label>
        <label class="chk"><input type="checkbox" data-layer="layer-borders" checked />Границы стран</label>
        <label class="chk"><input type="checkbox" data-layer="layer-roads" checked />Дороги</label>
        <label class="chk"><input type="checkbox" data-layer="layer-routes" checked />Морские пути</label>
        <label class="chk"><input type="checkbox" data-layer="layer-settlements" checked />Поселения</label>
        <label class="chk"><input type="checkbox" data-layer="layer-wildsites" checked />Дикие места</label>
        <label class="chk"><input type="checkbox" data-layer="layer-pois" />Важные места</label>
        <label class="chk"><input type="checkbox" data-layer="layer-deposits" />Месторождения</label>
        <label class="chk"><input type="checkbox" data-layer="layer-currents" />Течения</label>
        <label class="chk"><input type="checkbox" data-layer="layer-labels" checked />Названия</label>
        <label class="chk"><input type="checkbox" data-layer="layer-frame" checked />Рамка</label>
        <label class="chk"><input type="checkbox" data-layer="layer-legend" id="chk-legend" />Легенда</label>
        <label class="chk"><input type="checkbox" data-layer="layer-custom-roads" checked />Свои дороги</label>
      </div>
    </div>

    <div id="pop-export" class="popover right" style="width:210px;">
      <div class="pop-title">Сохранить карту</div>
      <div style="display:flex;flex-direction:column;gap:7px;">
        <button id="btn-dl-png" class="btn-rect primary-soft">Экспорт PNG</button>
        <button id="btn-dl-svg" class="btn-rect">Экспорт SVG</button>
      </div>
    </div>
  </div>
</header>

<!-- Floating Bottom-Left Inspector -->
<aside id="inspect-card" class="float-card">
  <div class="card-head">
    <div>
      <div class="card-title" id="inspect-title">Точка на карте</div>
      <div class="card-coords" id="inspect-coords">0.00°, 0.00°</div>
    </div>
    <button id="btn-inspect-close" class="icon-btn" title="Закрыть">✕</button>
  </div>
  <div class="kv" id="inspect-kv"></div>
  <div class="card-actions" id="inspect-actions" style="display:none;"></div>
  <details class="res-details">
    <summary id="inspect-res-summary">Ресурсы и полезные ископаемые</summary>
    <div id="inspect-resources"></div>
  </details>
</aside>

<!-- Floating Bottom Center Dock -->
<div id="dock-wrap">
  <div id="tool-subbar" class="pill"></div>
  <div class="pill">
    <button id="tool-inspect" class="active">Обзор</button>
    <button id="tool-road">Дорога</button>
    <button id="tool-marker">Метка</button>
  </div>
</div>

<!-- Floating Bottom-Right Zoom & Legend -->
<div id="corner-controls" class="pill">
  <button id="btn-legend-quick" title="Показать/скрыть легенду">Легенда</button>
  <span class="sep"></span>
  <button id="btn-zoom-out" class="icon-btn" title="Отдалить">−</button>
  <span id="zoom-pct">100%</span>
  <button id="btn-zoom-in" class="icon-btn" title="Приблизить">+</button>
  <button id="btn-fit" class="icon-btn" title="Вписать карту">⤢</button>
</div>

<!-- New World Modal -->
<div id="modal-backdrop">
  <div class="modal-card">
    <div class="modal-head">
      <h2>Новый мир</h2>
      <button id="btn-modal-close" class="icon-btn">✕</button>
    </div>
    <div class="field">
      <label><span>Сид (Seed)</span></label>
      <div style="display:flex;gap:6px;">
        <input type="text" id="inp-seed" value="e" />
        <button id="btn-modal-rand" class="subtle" title="Случайный сид">🎲</button>
      </div>
    </div>
    <div class="grid-2" style="margin-bottom:11px;">
      <div class="field" style="margin:0;">
        <label><span>Материки</span></label>
        <select id="inp-continents">
          <option value="0" selected>Авто (1–5)</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
        </select>
      </div>
      <div class="field" style="margin:0;">
        <label><span>Разрешение сетки</span></label>
        <select id="inp-w">
          <option value="360">360×180 (быстро)</option>
          <option value="540">540×270 (средне)</option>
          <option value="720" selected>720×360 (чётко)</option>
        </select>
      </div>
    </div>

    <details class="phys-details">
      <summary>Физика планеты (земная группа)</summary>
      <div style="margin-top:10px;">
        <div class="field">
          <label><span>Тектоническая активность</span><span id="val-activity">1.00</span></label>
          <input type="range" id="inp-activity" min="0.5" max="1.5" step="0.05" value="1.00" />
        </div>
        <div class="field">
          <label><span>Объём воды (глубина океана)</span><span id="val-water">2.62</span></label>
          <input type="range" id="inp-water" min="1.8" max="3.4" step="0.04" value="2.62" />
        </div>
        <div class="field">
          <label><span>Наклон оси</span><span id="val-tilt">23.4°</span></label>
          <input type="range" id="inp-tilt" min="10" max="35" step="0.2" value="23.4" />
        </div>
        <div class="field">
          <label><span>Сдвиг климата (инсоляция)</span><span id="val-solar">0.0°C</span></label>
          <input type="range" id="inp-solar" min="-6" max="6" step="0.5" value="0.0" />
        </div>
        <div class="field">
          <label><span>Скорость вращения</span><span id="val-rot">1.00×</span></label>
          <input type="range" id="inp-rot" min="0.6" max="1.6" step="0.05" value="1.00" />
        </div>
        <button id="btn-reset-earth" class="subtle" style="width:100%;font-size:12px;">Сбросить к Земле</button>
      </div>
    </details>

    <div class="modal-actions">
      <button id="btn-modal-cancel" class="subtle">Отмена</button>
      <button id="btn-generate" class="primary">Создать мир</button>
    </div>
  </div>
</div>

<script>
const state = {
  mode: 'world',
  tool: 'inspect',      // 'inspect' | 'road' | 'marker'
  style: 'sepia',       // 'sepia' | 'ink' | 'color'
  world: null,
  region: null,
  civ: {
    realms: false,
    cities: false,
    routes: false,
    targetRealms: 0,
    salt: 0,
  },
  roadTier: 2,          // 1 = Тропа, 2 = Дорога, 3 = Тракт
  roadFrom: null,       // { id, kind, subkind, name, subtitle, lat, lon }
  roadHint: 'Выберите точку А на карте',
  markerKind: 'settlement', // 'settlement' | 'landmark' | 'geo'
  customMarkers: [],    // [{ id, kind, subkind, name, subtitle, lat, lon }]
  customRoads: [],      // [{ id, cls, is_sea, fromName, toName, lengthKm, maxElevM, geo_pts }]
  markerSeq: 0,
  inspectPoint: null,   // { lat, lon }
  scale: 1,
  tx: 0,
  ty: 0,
  panCandidate: false,
  dragging: false,
  spaceDown: false,
  lastX: 0,
  lastY: 0,
  downX: 0,
  downY: 0,
  loading: false,
};

const $ = (id) => document.getElementById(id);

function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

let toastTimer = null;
function showToast(msg, ms = 3200) {
  const el = $('toast-banner');
  if (!el) return;
  el.textContent = String(msg ?? '');
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  if (ms > 0) {
    toastTimer = setTimeout(hideToast, ms);
  }
}
function hideToast() {
  const el = $('toast-banner');
  if (el) el.classList.remove('show');
}

function setLoading(on, text = 'Обновление...') {
  state.loading = on;
  $('loading-text').textContent = text;
  $('loading-banner').classList.toggle('show', on);
}

function worldParams() {
  return new URLSearchParams({
    seed: $('inp-seed').value.trim() || 'e',
    w: $('inp-w').value,
    continents: $('inp-continents').value,
    activity: $('inp-activity').value,
    water_depth: $('inp-water').value,
    tilt: $('inp-tilt').value,
    solar: $('inp-solar').value,
    rotation: $('inp-rot').value,
    style: state.style,
    civ_realms: state.civ.realms ? '1' : '0',
    civ_cities: state.civ.cities ? '1' : '0',
    civ_routes: state.civ.routes ? '1' : '0',
    target_realms: String(state.civ.targetRealms),
    civ_salt: String(state.civ.salt),
  });
}

let settleTimer = null;
function applyTransform() {
  clampView();
  $('panzoom').style.willChange = 'transform';
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => { $('panzoom').style.willChange = ''; }, 200);
  $('panzoom').style.transform = `translate(${state.tx}px, ${state.ty}px) scale(${state.scale})`;
  $('zoom-pct').textContent = Math.round(state.scale * 100) + '%';
  keepSymbolSize();
  scheduleTiles();
}

function pattersonY(phi) {
  const p2 = phi * phi, p4 = p2 * p2, p6 = p4 * p2, p8 = p4 * p4;
  return phi * (1.0148 + p4 * 0.23185 + p6 * (-0.14499) + p8 * 0.02406);
}
function worldGeoToSvg(proj, latDeg, lonDeg) {
  const dlon = ((((lonDeg - proj.center_lon + 180) % 360) + 360) % 360 - 180) * Math.PI / 180;
  const yp = pattersonY(latDeg * Math.PI / 180);
  const [fx, fy, fw, fh] = proj.frame;
  return [
    fx + fw * 0.5 + (dlon - proj.origin_x_rad) * proj.px_per_unit,
    fy + fh * 0.5 - (yp - proj.origin_y_pat) * proj.px_per_unit,
  ];
}
function projectGeoToCurrentSvg(latDeg, lonDeg) {
  if (state.world && state.world.proj) {
    return worldGeoToSvg(state.world.proj, latDeg, lonDeg);
  }
  return null;
}

let lodVersion = 0;

function sizeSvg() {
  const svg = $('map-stage').querySelector('svg');
  if (!svg) return null;
  const vb = svg.viewBox.baseVal;
  const w = vb && vb.width ? vb.width : (state.mode === 'world' ? 2200 : 1680);
  const h = vb && vb.height ? vb.height : (state.mode === 'world' ? 1175 : 1274);
  svg.style.width = w + 'px';
  svg.style.height = h + 'px';
  return { svg, w, h };
}

const MAX_SCALE = 64;

// Наименьший масштаб: карта закрывает весь экран, поля и рамка атласа не видны.
function minScale() {
  const vp = $('viewport').getBoundingClientRect();
  const proj = state.world && state.world.proj;
  return proj ? Math.max(vp.width / proj.frame[2], vp.height / proj.frame[3]) : 0.15;
}

function clampView() {
  const proj = state.world && state.world.proj;
  if (!proj) return;
  const vp = $('viewport').getBoundingClientRect();
  const [fx, fy, fw, fh] = proj.frame;
  state.scale = Math.max(minScale(), Math.min(MAX_SCALE, state.scale));
  const s = state.scale;
  state.tx = Math.min(-fx * s, Math.max(vp.width - (fx + fw) * s, state.tx));
  state.ty = Math.min(-fy * s, Math.max(vp.height - (fy + fh) * s, state.ty));
}

function fitToViewport() {
  const sz = sizeSvg();
  if (!sz) return;
  const vp = $('viewport').getBoundingClientRect();
  state.scale = minScale();
  state.tx = (vp.width - sz.w * state.scale) * 0.5;
  state.ty = (vp.height - sz.h * state.scale) * 0.5;
  applyTransform();
}

// ---------- Плавный зум ----------
let zoomAnim = null; // { scale, mx, my }

function zoomAt(mx, my, factor) {
  const from = zoomAnim ? zoomAnim.scale : state.scale;
  const scale = Math.max(minScale(), Math.min(MAX_SCALE, from * factor));
  const running = !!zoomAnim;
  zoomAnim = { scale, mx, my };
  if (!running) requestAnimationFrame(stepZoom);
}

function stepZoom() {
  if (!zoomAnim) return;
  const { scale, mx, my } = zoomAnim;
  let next = state.scale * Math.pow(scale / state.scale, 0.28);
  if (Math.abs(Math.log(scale / next)) < 0.004) next = scale;
  const ratio = next / state.scale;
  state.tx = mx - (mx - state.tx) * ratio;
  state.ty = my - (my - state.ty) * ratio;
  state.scale = next;
  if (next === scale) zoomAnim = null;
  applyTransform();
  if (zoomAnim) requestAnimationFrame(stepZoom);
}

function flyTo(x, y, scale) {
  zoomAnim = null;
  const vp = $('viewport').getBoundingClientRect();
  const from = { s: state.scale, x: (vp.width / 2 - state.tx) / state.scale, y: (vp.height / 2 - state.ty) / state.scale };
  const to = Math.max(minScale(), Math.min(MAX_SCALE, scale));
  const t0 = performance.now();
  const step = (now) => {
    const t = Math.min(1, (now - t0) / 700);
    const e = t * t * (3 - 2 * t);
    state.scale = from.s * Math.pow(to / from.s, e);
    state.tx = vp.width / 2 - (from.x + (x - from.x) * e) * state.scale;
    state.ty = vp.height / 2 - (from.y + (y - from.y) * e) * state.scale;
    applyTransform();
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// ---------- Тайлы крупного плана ----------
const TILE = { SIZE: 256, MAX_LEVEL: 7, FROM: 1.5 };
let tileTimer = null;

function scheduleTiles() {
  if (!tileTimer) tileTimer = setTimeout(() => { tileTimer = null; updateTiles(); }, 80);
}

function tileLayer(svg) {
  let layer = svg.getElementById('layer-tiles');
  if (layer) return layer;
  layer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  layer.setAttribute('id', 'layer-tiles');
  // Тайлы закрывают растровый обзор; дороги, границы, значки городов и подписи остаются сверху.
  svg.insertBefore(layer, svg.getElementById('layer-currents') || svg.getElementById('layer-routes'));
  const roads = svg.getElementById('layer-roads');
  if (roads) layer.after(roads);
  return layer;
}

function updateTiles() {
  const svg = $('map-stage').querySelector('svg');
  const proj = state.world && state.world.proj;
  if (!svg || !proj) return;
  const layer = tileLayer(svg);
  const density = state.scale * Math.min(1.5, window.devicePixelRatio || 1);
  if (density < TILE.FROM) {
    layer.replaceChildren();
    svg.classList.remove('tiled');
    return;
  }
  const level = Math.max(1, Math.min(TILE.MAX_LEVEL, Math.ceil(Math.log2(density * 0.75))));
  // Порядок вызовов задаёт очередь загрузки: сначала то, что на экране, затем подложки на случай
  // быстрого отдаления — средний уровень с запасом и грубый уровень всего мира.
  const top = fillLevel(layer, proj, level, 0);
  const mid = level > 3 ? fillLevel(layer, proj, level - 3, 1.5) : null;
  const world = level > 1 && level !== 4 ? fillLevel(layer, proj, 1, Infinity) : null;
  const groups = [...new Set([world, mid, top].filter(Boolean))];
  const ready = (g) => [...g.children].every((img) => img.dataset.ready);
  // Прежние уровни держим, пока новые не загрузятся целиком, — без мигания.
  if (ready(top) && (!mid || ready(mid))) {
    svg.classList.add('tiled');
    for (const other of [...layer.children]) if (!groups.includes(other)) other.remove();
  }
  const order = [...layer.children].filter((g) => !groups.includes(g));
  const base = world ? [world, ...order] : order;
  const next = base.concat(groups.filter((g) => g !== world));
  if (next.some((g, i) => layer.children[i] !== g)) next.forEach((g) => layer.appendChild(g));
}

// Тайлы одного уровня, покрывающие экран плюс `margin` экранов вокруг.
function fillLevel(layer, proj, level, margin) {
  let group = layer.querySelector(`g[data-level="${level}"]`);
  if (!group) {
    group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    group.dataset.level = level;
    layer.appendChild(group);
  }
  const [fx, fy, fw, fh] = proj.frame;
  const size = TILE.SIZE / 2 ** level;
  const vp = $('viewport').getBoundingClientRect();
  const mx = vp.width * margin, my = vp.height * margin;
  const x0 = Math.max(0, Math.floor(((-mx - state.tx) / state.scale - fx) / size));
  const y0 = Math.max(0, Math.floor(((-my - state.ty) / state.scale - fy) / size));
  const x1 = Math.min(Math.ceil(fw / size) - 1, Math.floor(((vp.width + mx - state.tx) / state.scale - fx) / size));
  const y1 = Math.min(Math.ceil(fh / size) - 1, Math.floor(((vp.height + my - state.ty) / state.scale - fy) / size));

  const params = worldParams();
  ['civ_realms', 'civ_cities', 'civ_routes', 'target_realms', 'civ_salt'].forEach((k) => params.delete(k));
  const wanted = new Set();
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const key = `${x}_${y}`;
      wanted.add(key);
      if (group.querySelector(`image[data-key="${key}"]`)) continue;
      const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
      img.dataset.key = key;
      img.setAttribute('x', fx + x * size);
      img.setAttribute('y', fy + y * size);
      img.setAttribute('width', size * (1 + 1 / TILE.SIZE)); // перекрытие в 1 px против щелей
      img.setAttribute('height', size * (1 + 1 / TILE.SIZE));
      img.addEventListener('load', () => { img.dataset.ready = '1'; scheduleTiles(); });
      img.addEventListener('error', () => img.remove());
      img.setAttribute('href', `/api/tile.png?${params}&level=${level}&x=${x}&y=${y}`);
      group.appendChild(img);
    }
  }
  for (const img of [...group.children]) {
    if (!wanted.has(img.dataset.key)) img.remove();
  }
  return group;
}

// Значки, подписи и линии не раздуваются вместе с картой.
function keepSymbolSize() {
  const svg = $('map-stage').querySelector('svg');
  if (!svg) return;
  const f = Math.min(1, TILE.FROM / state.scale);
  const key = f.toFixed(4);
  if (svg.dataset.symbolScale === key) return;
  svg.dataset.symbolScale = key;
  const pointLayers = ['layer-settlements', 'layer-wildsites', 'layer-pois', 'layer-deposits', 'layer-labels',
    'layer-waypoint-targets', 'layer-inspect-pin', 'layer-custom-roads'];
  const lineLayers = ['layer-roads', 'layer-routes', 'layer-borders', 'layer-custom-roads'];
  for (const id of lineLayers) {
    svg.querySelectorAll(`#${id} path`).forEach((el) => {
      for (const attr of ['stroke-width', 'stroke-dasharray']) {
        const k = attr === 'stroke-width' ? 'w0' : 'd0';
        if (el.dataset[k] === undefined) el.dataset[k] = el.getAttribute(attr) || '';
        if (el.dataset[k]) el.setAttribute(attr, el.dataset[k].split(/[ ,]+/).map((v) => v * f).join(' '));
      }
    });
  }
  // Подпись города уменьшается вокруг самого города, иначе она отъезжает от значка.
  const cities = [...svg.querySelectorAll('#layer-settlements [data-name][data-lat]')].map((el) => ({
    name: el.dataset.name.toUpperCase(),
    at: worldGeoToSvg(state.world.proj, Number(el.dataset.lat), Number(el.dataset.lon)),
  }));
  for (const id of pointLayers) {
    const layer = svg.getElementById(id);
    if (!layer) continue;
    for (const el of layer.children) {
      if (el.tagName === 'path' || !el.getBBox) continue; // пользовательские дороги масштабируются как линии
      if (el.dataset.t0 === undefined) {
        // Якорь — точка на карте: координаты поселения, иначе значок (первый элемент группы).
        const icon = el.tagName === 'g' ? [...el.children].find((c) => c.getBBox) : null;
        const b = (icon || el).getBBox();
        let anchor = [b.x + b.width / 2, b.y + b.height / 2];
        if (el.dataset.lat !== undefined && state.world) {
          anchor = worldGeoToSvg(state.world.proj, Number(el.dataset.lat), Number(el.dataset.lon));
        } else if (el.tagName === 'text') {
          const text = el.textContent.trim().toUpperCase();
          const dist = (c) => Math.hypot(c.at[0] - anchor[0], c.at[1] - anchor[1]);
          const city = cities.filter((c) => c.name === text).sort((x, y) => dist(x) - dist(y))[0];
          if (city && dist(city) < b.width + 20) anchor = city.at;
        }
        el.dataset.t0 = el.getAttribute('transform') || '';
        [el.dataset.cx, el.dataset.cy] = anchor;
      }
      const { cx, cy, t0 } = el.dataset;
      el.setAttribute('transform', `${t0} translate(${cx} ${cy}) scale(${f}) translate(${-cx} ${-cy})`);
    }
  }
}

// Прячет поля бумаги и рамку вокруг карты (только на экране).
function clipToMap() {
  const svg = $('map-stage').querySelector('svg');
  const proj = state.world && state.world.proj;
  if (!svg || !proj) return;
  const [fx, fy, fw, fh] = proj.frame;
  const w = svg.viewBox.baseVal.width, h = svg.viewBox.baseVal.height;
  const pad = 10; // двойная линия рамки
  $('map-stage').style.clipPath = `inset(${fy + pad}px ${w - fx - fw + pad}px ${h - fy - fh + pad}px ${fx + pad}px)`;
}

function applyLayerToggles() {
  const svg = $('map-stage').querySelector('svg');
  if (!svg) return;
  document.querySelectorAll('input[data-layer]').forEach((cb) => {
    const el = svg.getElementById(cb.dataset.layer);
    if (el) el.style.display = cb.checked ? '' : 'none';
  });
  $('btn-legend-quick').classList.toggle('active', $('chk-legend').checked);
}

function activeWaypoints() {
  const src = state.world;
  const base = (src && src.waypoints) ? src.waypoints : [];
  return [...base, ...state.customMarkers];
}

function activeData() {
  return state.world;
}

function roadPalette() {
  if (state.style === 'ink') {
    return {
      casing: '#f7f7f5', ink: '#151515', fill: '#e8e8e6',
      highway: '#151515', sea: '#151515', text: '#151515', halo: '#f7f7f5',
      markerCity: '#151515', markerLandmark: '#3a3a3a', markerGeo: '#525252',
    };
  }
  if (state.style === 'color') {
    return {
      casing: '#ffffff', ink: '#2d2a26', fill: '#f3ebd8',
      highway: 'rgb(178, 40, 34)', sea: '#285278', text: '#24201b', halo: '#f5efe1',
      markerCity: '#b22822', markerLandmark: '#2c6b53', markerGeo: '#345d82',
    };
  }
  return {
    casing: '#dfd6c5', ink: '#3b3229', fill: '#f0e6d2',
    highway: '#543521', sea: '#42372c', text: '#362d24', halo: '#e4dac9',
    markerCity: '#47301e', markerLandmark: '#4b5a34', markerGeo: '#3d4f5c',
  };
}

function ensureOverlayLayer(svg, id, beforeLabels = true) {
  let g = svg.getElementById(id);
  if (!g) {
    const ns = 'http://www.w3.org/2000/svg';
    g = document.createElementNS(ns, 'g');
    g.setAttribute('id', id);
    g.setAttribute('clip-path', 'url(#fmsFrameClip)');
    const labels = beforeLabels ? svg.getElementById('layer-labels') : null;
    if (labels && labels.parentNode === svg) svg.insertBefore(g, labels);
    else svg.appendChild(g);
  }
  return g;
}

function splitSegmentsByAntimeridian(pts, vbWidth) {
  if (!pts || pts.length < 2) return [];
  const jumpThr = (vbWidth || 2200) * 0.45;
  const out = [];
  let cur = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    if (Math.abs(pts[i][0] - pts[i - 1][0]) > jumpThr) {
      if (cur.length >= 2) out.push(cur);
      cur = [pts[i]];
    } else {
      cur.push(pts[i]);
    }
  }
  if (cur.length >= 2) out.push(cur);
  return out;
}

function renderCustomOverlays() {
  const svg = $('map-stage').querySelector('svg');
  if (!svg) return;
  const ns = 'http://www.w3.org/2000/svg';
  const vb = svg.viewBox.baseVal;
  const vbw = vb && vb.width ? vb.width : 2200;
  const us = vbw / 2200 * 1.15;
  const pal = roadPalette();

  // 1. Custom roads & markers group (persists across tools/styles/LOD)
  const gCustom = ensureOverlayLayer(svg, 'layer-custom-roads', true);
  gCustom.innerHTML = '';

  for (const r of state.customRoads) {
    const projected = [];
    for (const [lat, lon] of r.geo_pts) {
      const p = projectGeoToCurrentSvg(lat, lon);
      if (p) projected.push(p);
    }
    const segs = splitSegmentsByAntimeridian(projected, vbw);
    for (const seg of segs) {
      const d = 'M' + seg.map((pt) => `${pt[0].toFixed(1)},${pt[1].toFixed(1)}`).join(' L');
      if (r.is_sea) {
        const seaHalo = document.createElementNS(ns, 'path');
        seaHalo.setAttribute('d', d);
        seaHalo.setAttribute('fill', 'none');
        seaHalo.setAttribute('stroke', pal.halo);
        seaHalo.setAttribute('stroke-width', (3.0 * us).toFixed(2));
        seaHalo.setAttribute('opacity', '0.45');
        gCustom.appendChild(seaHalo);

        const seaLine = document.createElementNS(ns, 'path');
        seaLine.setAttribute('d', d);
        seaLine.setAttribute('fill', 'none');
        seaLine.setAttribute('stroke', pal.sea);
        seaLine.setAttribute('stroke-width', (1.7 * us).toFixed(2));
        seaLine.setAttribute('stroke-dasharray', `${(6 * us).toFixed(1)},${(5 * us).toFixed(1)}`);
        seaLine.setAttribute('stroke-linecap', 'round');
        seaLine.setAttribute('opacity', '0.88');
        gCustom.appendChild(seaLine);
      } else if (r.cls === 1) {
        const trail = document.createElementNS(ns, 'path');
        trail.setAttribute('d', d);
        trail.setAttribute('fill', 'none');
        trail.setAttribute('stroke', pal.ink);
        trail.setAttribute('stroke-width', (1.6 * us).toFixed(2));
        trail.setAttribute('stroke-dasharray', `${(4.2 * us).toFixed(1)},${(3.8 * us).toFixed(1)}`);
        trail.setAttribute('stroke-linecap', 'round');
        trail.setAttribute('opacity', '0.86');
        gCustom.appendChild(trail);
      } else if (r.cls === 3) {
        const casePath = document.createElementNS(ns, 'path');
        casePath.setAttribute('d', d);
        casePath.setAttribute('fill', 'none');
        casePath.setAttribute('stroke', pal.casing);
        casePath.setAttribute('stroke-width', (4.8 * us).toFixed(2));
        casePath.setAttribute('stroke-linecap', 'round');
        casePath.setAttribute('stroke-linejoin', 'round');
        casePath.setAttribute('opacity', '0.92');
        gCustom.appendChild(casePath);

        const core = document.createElementNS(ns, 'path');
        core.setAttribute('d', d);
        core.setAttribute('fill', 'none');
        core.setAttribute('stroke', pal.highway);
        core.setAttribute('stroke-width', (2.3 * us).toFixed(2));
        core.setAttribute('stroke-linecap', 'round');
        core.setAttribute('stroke-linejoin', 'round');
        gCustom.appendChild(core);
      } else {
        const casePath = document.createElementNS(ns, 'path');
        casePath.setAttribute('d', d);
        casePath.setAttribute('fill', 'none');
        casePath.setAttribute('stroke', pal.ink);
        casePath.setAttribute('stroke-width', (3.4 * us).toFixed(2));
        casePath.setAttribute('stroke-linecap', 'round');
        casePath.setAttribute('stroke-linejoin', 'round');
        casePath.setAttribute('opacity', '0.85');
        gCustom.appendChild(casePath);

        const inner = document.createElementNS(ns, 'path');
        inner.setAttribute('d', d);
        inner.setAttribute('fill', 'none');
        inner.setAttribute('stroke', pal.fill);
        inner.setAttribute('stroke-width', (1.45 * us).toFixed(2));
        inner.setAttribute('stroke-linecap', 'round');
        inner.setAttribute('stroke-linejoin', 'round');
        gCustom.appendChild(inner);
      }
    }
  }

  for (const m of state.customMarkers) {
    const p = projectGeoToCurrentSvg(m.lat, m.lon);
    if (!p) continue;
    const [mx, my] = p;
    if (m.kind === 'settlement') {
      const s = 4.6 * us;
      const d = document.createElementNS(ns, 'polygon');
      d.setAttribute('points', `${mx},${my - s} ${mx + s},${my} ${mx},${my + s} ${mx - s},${my}`);
      d.setAttribute('fill', pal.fill);
      d.setAttribute('stroke', pal.ink);
      d.setAttribute('stroke-width', (1.6 * us).toFixed(2));
      gCustom.appendChild(d);

      const dot = document.createElementNS(ns, 'circle');
      dot.setAttribute('cx', mx.toFixed(1));
      dot.setAttribute('cy', my.toFixed(1));
      dot.setAttribute('r', (1.5 * us).toFixed(2));
      dot.setAttribute('fill', pal.ink);
      gCustom.appendChild(dot);
    } else if (m.kind === 'landmark') {
      const s = 4.8 * us;
      const poly = document.createElementNS(ns, 'polygon');
      poly.setAttribute('points', `${mx},${my - s} ${mx + s},${my} ${mx},${my + s} ${mx - s},${my}`);
      poly.setAttribute('fill', pal.ink);
      poly.setAttribute('stroke', pal.halo);
      poly.setAttribute('stroke-width', (1.3 * us).toFixed(2));
      gCustom.appendChild(poly);
    } else {
      const s = 5.0 * us;
      const tri = document.createElementNS(ns, 'polygon');
      tri.setAttribute('points', `${mx},${my - s} ${mx + s * 0.9},${my + s * 0.75} ${mx - s * 0.9},${my + s * 0.75}`);
      tri.setAttribute('fill', 'none');
      tri.setAttribute('stroke', pal.ink);
      tri.setAttribute('stroke-width', (1.5 * us).toFixed(2));
      gCustom.appendChild(tri);
    }
    const lbl = document.createElementNS(ns, 'text');
    lbl.setAttribute('x', (mx + 8 * us).toFixed(1));
    lbl.setAttribute('y', (my + 3.5 * us).toFixed(1));
    lbl.setAttribute('fill', pal.text);
    lbl.setAttribute('stroke', pal.halo);
    lbl.setAttribute('stroke-width', (3.0 * us).toFixed(2));
    lbl.setAttribute('paint-order', 'stroke');
    lbl.setAttribute('font-family', 'Georgia, "Times New Roman", serif');
    lbl.setAttribute('font-size', (11.5 * us).toFixed(1));
    if (m.kind === 'geo') lbl.setAttribute('font-style', 'italic');
    else lbl.setAttribute('font-weight', '600');
    lbl.textContent = m.name;
    gCustom.appendChild(lbl);
  }

  // 2. Waypoint hit targets (no colored circles over native settlement icons)
  const gTargets = ensureOverlayLayer(svg, 'layer-waypoint-targets', false);
  gTargets.innerHTML = '';
  gTargets.style.display = state.tool === 'road' ? '' : 'none';
  if (state.tool === 'road') {
    const wps = activeWaypoints();
    for (const w of wps) {
      const p = projectGeoToCurrentSvg(w.lat, w.lon);
      if (!p) continue;
      const [wx, wy] = p;
      const isSelected = state.roadFrom && state.roadFrom.id === w.id;

      const grp = document.createElementNS(ns, 'g');
      grp.setAttribute('class', 'wp-ring');
      const title = document.createElementNS(ns, 'title');
      title.textContent = `${w.name} (${w.subtitle})`;
      grp.appendChild(title);

      if (isSelected) {
        const s = 10.5 * us;
        const sel = document.createElementNS(ns, 'polygon');
        sel.setAttribute('points', `${wx},${wy - s} ${wx + s},${wy} ${wx},${wy + s} ${wx - s},${wy}`);
        sel.setAttribute('fill', 'rgba(242, 184, 75, 0.22)');
        sel.setAttribute('stroke', '#d99b38');
        sel.setAttribute('stroke-width', (1.9 * us).toFixed(2));
        grp.appendChild(sel);
      } else if (w.kind !== 'settlement' && w.kind !== 'wild') {
        const s = 4.2 * us;
        const mark = document.createElementNS(ns, 'polygon');
        if (w.kind === 'geo') {
          mark.setAttribute('points', `${wx},${wy - s} ${wx + s * 0.85},${wy + s * 0.75} ${wx - s * 0.85},${wy + s * 0.75}`);
        } else {
          mark.setAttribute('points', `${wx},${wy - s} ${wx + s},${wy} ${wx},${wy + s} ${wx - s},${wy}`);
        }
        mark.setAttribute('fill', pal.fill);
        mark.setAttribute('stroke', pal.ink);
        mark.setAttribute('stroke-width', (1.25 * us).toFixed(2));
        mark.setAttribute('opacity', '0.88');
        grp.appendChild(mark);
      }

      const hit = document.createElementNS(ns, 'circle');
      hit.setAttribute('cx', wx.toFixed(1));
      hit.setAttribute('cy', wy.toFixed(1));
      hit.setAttribute('r', (14 * us).toFixed(2));
      hit.setAttribute('fill', 'transparent');
      grp.appendChild(hit);

      gTargets.appendChild(grp);
    }
  }

  // 3. Inspection pin (when inspectPoint exists)
  const gPin = ensureOverlayLayer(svg, 'layer-inspect-pin', false);
  gPin.innerHTML = '';
  if (state.inspectPoint) {
    const p = projectGeoToCurrentSvg(state.inspectPoint.lat, state.inspectPoint.lon);
    if (p) {
      const [ix, iy] = p;
      const outer = document.createElementNS(ns, 'circle');
      outer.setAttribute('cx', ix.toFixed(1));
      outer.setAttribute('cy', iy.toFixed(1));
      outer.setAttribute('r', (7.5 * us).toFixed(2));
      outer.setAttribute('fill', 'rgba(227, 179, 98, 0.28)');
      outer.setAttribute('stroke', '#f5d28a');
      outer.setAttribute('stroke-width', (2.0 * us).toFixed(2));
      gPin.appendChild(outer);

      const inner = document.createElementNS(ns, 'circle');
      inner.setAttribute('cx', ix.toFixed(1));
      inner.setAttribute('cy', iy.toFixed(1));
      inner.setAttribute('r', (2.6 * us).toFixed(2));
      inner.setAttribute('fill', '#e3b362');
      gPin.appendChild(inner);
    }
  }

  applyLayerToggles();
  delete svg.dataset.symbolScale;
  keepSymbolSize();
}

function updateToolSubbar() {
  const bar = $('tool-subbar');
  if (state.tool === 'inspect') {
    bar.classList.remove('show');
    bar.innerHTML = '';
    return;
  }
  bar.classList.add('show');
  if (state.tool === 'road') {
    bar.innerHTML = `
      <button data-tier="1" class="${state.roadTier === 1 ? 'active' : ''}">Тропа</button>
      <button data-tier="2" class="${state.roadTier === 2 ? 'active' : ''}">Дорога</button>
      <button data-tier="3" class="${state.roadTier === 3 ? 'active' : ''}">Тракт</button>
      <span class="sep"></span>
      <span class="road-status" id="road-status">${escapeHtml(state.roadHint)}</span>
      ${state.roadFrom ? '<button id="btn-road-cancel" class="subtle">Отмена</button>' : ''}
      ${state.customRoads.length > 0 || state.customMarkers.length > 0 ? '<button id="btn-clear-custom" class="subtle">Очистить</button>' : ''}
    `;
    bar.querySelectorAll('button[data-tier]').forEach((b) => {
      b.onclick = () => {
        state.roadTier = parseInt(b.dataset.tier, 10);
        updateToolSubbar();
      };
    });
    const cancel = $('btn-road-cancel');
    if (cancel) cancel.onclick = () => {
      state.roadFrom = null;
      state.roadHint = 'Выберите точку А на карте';
      updateToolSubbar();
      renderCustomOverlays();
    };
    const clearBtn = $('btn-clear-custom');
    if (clearBtn) clearBtn.onclick = clearCustomItems;
  } else if (state.tool === 'marker') {
    bar.innerHTML = `
      <button data-mkind="settlement" class="${state.markerKind === 'settlement' ? 'active' : ''}">Поселение</button>
      <button data-mkind="landmark" class="${state.markerKind === 'landmark' ? 'active' : ''}">Важное место</button>
      <button data-mkind="geo" class="${state.markerKind === 'geo' ? 'active' : ''}">Геометка</button>
      <span class="sep"></span>
      <input type="text" id="inp-marker-name" placeholder="Название (необяз.)" />
      ${state.customMarkers.length > 0 || state.customRoads.length > 0 ? '<button id="btn-clear-custom" class="subtle">Очистить</button>' : ''}
    `;
    bar.querySelectorAll('button[data-mkind]').forEach((b) => {
      b.onclick = () => {
        state.markerKind = b.dataset.mkind;
        updateToolSubbar();
      };
    });
    const clearBtn = $('btn-clear-custom');
    if (clearBtn) clearBtn.onclick = clearCustomItems;
  }
}

function clearCustomItems() {
  state.customMarkers = [];
  state.customRoads = [];
  state.roadFrom = null;
  state.roadHint = 'Выберите точку А на карте';
  updateToolSubbar();
  renderCustomOverlays();
}

function setTool(nextTool) {
  state.tool = nextTool;
  if (nextTool !== 'road') {
    state.roadFrom = null;
    state.roadHint = 'Выберите точку А на карте';
  }
  const vp = $('viewport');
  vp.classList.toggle('tool-road', nextTool === 'road');

  $('tool-road').classList.toggle('active', nextTool === 'road');
  $('tool-marker').classList.toggle('active', nextTool === 'marker');
  updateToolSubbar();
  renderCustomOverlays();
}

function triggerDownload(url, filename) {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.fmsSave) {
    window.webkit.messageHandlers.fmsSave.postMessage({ url, filename });
  } else if (window.ipc && typeof window.ipc.postMessage === 'function') {
    window.ipc.postMessage('SAVE_URL\n' + filename + '\n' + url);
  } else {
    window.open(url, '_blank');
  }
}
function saveBase64(dataBase64, mime, filename) {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.fmsSave) {
    window.webkit.messageHandlers.fmsSave.postMessage({ dataBase64, filename });
  } else if (window.ipc && typeof window.ipc.postMessage === 'function') {
    window.ipc.postMessage('SAVE_B64\n' + filename + '\n' + dataBase64);
  } else {
    const a = document.createElement('a');
    a.href = `data:${mime};base64,${dataBase64}`;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
}
async function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = reject;
    fr.readAsDataURL(blob);
  });
}
async function buildSelfContainedSvgXml(active) {
  const liveSvg = $('map-stage').querySelector('svg');
  if (!liveSvg) return null;
  const clone = liveSvg.cloneNode(true);
  const tiles = clone.querySelector('#layer-tiles');
  if (tiles) tiles.remove();
  clone.querySelectorAll('[data-t0]').forEach((el) => el.setAttribute('transform', el.dataset.t0));
  clone.querySelectorAll('[data-w0], [data-d0]').forEach((el) => {
    if (el.dataset.w0) el.setAttribute('stroke-width', el.dataset.w0);
    if (el.dataset.d0) el.setAttribute('stroke-dasharray', el.dataset.d0);
  });
  const tgt = clone.querySelector('#layer-waypoint-targets');
  if (tgt) tgt.remove();
  const pin = clone.querySelector('#layer-inspect-pin');
  if (pin) pin.remove();
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
  const vb = liveSvg.viewBox.baseVal;
  const w = vb && vb.width ? vb.width : active.width;
  const h = vb && vb.height ? vb.height : active.height;
  clone.setAttribute('width', String(w));
  clone.setAttribute('height', String(h));
  clone.style.width = '';
  clone.style.height = '';
  const baseImg = clone.querySelector('#layer-base');
  if (baseImg && active.map_png_url) {
    const res = await fetch(active.map_png_url);
    if (res.ok) {
      const dataUrl = await blobToDataUrl(await res.blob());
      baseImg.setAttribute('href', dataUrl);
      baseImg.removeAttribute('xlink:href');
    }
  }
  return { xml: new XMLSerializer().serializeToString(clone), w, h };
}
async function exportLivePng(active, filename) {
  setLoading(true, 'Экспорт PNG...');
  try {
    const built = await buildSelfContainedSvgXml(active);
    if (!built) { triggerDownload(active.download_png_url, filename); return; }
    const svgDataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(built.xml);
    const img = new Image();
    await new Promise((resolve, reject) => {
      img.onload = resolve; img.onerror = reject; img.src = svgDataUrl;
    });
    const canvas = document.createElement('canvas');
    canvas.width = built.w; canvas.height = built.h;
    canvas.getContext('2d').drawImage(img, 0, 0, built.w, built.h);
    const pngUrl = canvas.toDataURL('image/png');
    saveBase64(pngUrl.slice(pngUrl.indexOf(',') + 1), 'image/png', filename);
  } catch (_) {
    triggerDownload(active.download_png_url, filename);
  } finally {
    setLoading(false);
  }
}
async function exportLiveSvg(active, filename) {
  setLoading(true, 'Экспорт SVG...');
  try {
    const built = await buildSelfContainedSvgXml(active);
    if (!built) { triggerDownload(active.download_svg_url, filename); return; }
    const bytes = new TextEncoder().encode(built.xml);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    saveBase64(btoa(bin), 'image/svg+xml', filename);
  } catch (_) {
    triggerDownload(active.download_svg_url, filename);
  } finally {
    setLoading(false);
  }
}

function updateDownloads() {

  const w = data || state.world;
  if (!w) return;
  const badge = $('civ-badge');
  const hasCiv = w.realms_count > 0 || w.settlements_count > 0 || state.civ.routes;
  badge.classList.toggle('has-civ', hasCiv);

  } else {

    if (w.realms_count > 0) parts.push(`${w.realms_count} стран`);
    if (w.settlements_count > 0) parts.push(`${w.settlements_count} гор.`);
    if (state.civ.routes) parts.push('пути');

    $('civ-stats').textContent = `Материков: ${w.continents_count} · Держав: ${w.realms_count} · Городов: ${w.settlements_count}`;
  }

      <span><span class="swatch" style="background:rgb(${Number(r.color[0])},${Number(r.color[1])},${Number(r.color[2])})"></span>${escapeHtml(r.name)}</span>
      <span style="color:var(--muted);">${escapeHtml(r.capital)}</span>

  box.querySelectorAll('.realm-item').forEach((el) => {

      closePopovers();

  });
}

let activeBaseObjectUrl = null;

async function renderSvgOverlay(url, opts = {}) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(await res.text());
  const text = await res.text();
  if (opts.ver !== undefined && opts.ver !== lodVersion) return false;
  const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
  const svg = doc.documentElement;
  const baseImgEl = svg.querySelector('#layer-base');
  const href = baseImgEl && (baseImgEl.getAttribute('href') || baseImgEl.getAttribute('xlink:href'));
  let nextObjUrl = null;
  if (href && !href.startsWith('data:')) {
    const imgRes = await fetch(href);
    if (opts.ver !== undefined && opts.ver !== lodVersion) return false;
    if (imgRes.ok) {
      const blob = await imgRes.blob();
      nextObjUrl = URL.createObjectURL(blob);
      await new Promise((resolve) => {
        const pre = new Image();
        pre.onload = () => {
          if (pre.decode) pre.decode().catch(() => {}).finally(resolve);
          else resolve();
        };
        pre.onerror = resolve;
        pre.src = nextObjUrl;
      });
      if (opts.ver !== undefined && opts.ver !== lodVersion) {
        URL.revokeObjectURL(nextObjUrl);
        return false;
      }
      baseImgEl.setAttribute('href', nextObjUrl);
      baseImgEl.removeAttribute('xlink:href');
    }
  }
  const stage = $('map-stage');
  stage.innerHTML = '';
  stage.appendChild(document.importNode(svg, true));
  if (activeBaseObjectUrl) URL.revokeObjectURL(activeBaseObjectUrl);
  activeBaseObjectUrl = nextObjUrl;
  if (opts.view) {
    sizeSvg();
    const v = opts.view();
    state.scale = v.scale;
    state.tx = v.tx;
    state.ty = v.ty;
    applyTransform();
  } else {
    fitToViewport();
  }
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  return true;
}

async function loadWorld(o = {}) {
  if (o.ver === undefined) lodVersion++;
  setLoading(true, o.ver === undefined ? 'Генерация мира...' : 'Обновляю карту...');
  try {
    const p = worldParams();
    const res = await fetch('/api/world?' + p.toString());
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    if (o.ver !== undefined && o.ver !== lodVersion) return false;
    const ok = await renderSvgOverlay(data.overlay_svg_url, {
      ver: o.ver,
      view: o.view ? () => o.view(data) : null,
    });
    if (!ok) return false;
    state.world = data;
    state.mode = 'world';
    // Тайлы, запрошенные до обновления state.world, могли взять прежнюю проекцию.
    const stale = $('map-stage').querySelector('#layer-tiles');
    if (stale) stale.replaceChildren();
    clipToMap();
    const current = $('map-stage').querySelector('svg');
    if (current) {
      delete current.dataset.symbolScale;
      current.querySelectorAll('[data-t0]').forEach((el) => {
        el.setAttribute('transform', el.dataset.t0);
        delete el.dataset.t0;
      });
    }
    if (o.view) applyTransform(); else fitToViewport();
    $('badge-seed').textContent = 'seed: ' + data.seed;
    updateCivUi(data);
    renderCustomOverlays();
    updateDownloads();
    return true;
  } catch (err) {
    if (o.ver === undefined) alert('Ошибка генерации мира: ' + err.message);
    else console.warn('world:', err);
    return false;
  } finally {
    setLoading(false);
  }
}

// Плавно подлетает к точке на той же карте.
function focusOn(lat, lon, spanLon) {
  if (!state.world) return;
  const vp = $('viewport').getBoundingClientRect();
  const [x, y] = worldGeoToSvg(state.world.proj, lat, lon);
  flyTo(x, y, vp.width / (spanLon * state.world.px_per_deg_lon));
}

function reloadCurrent() {
  const saved = { scale: state.scale, tx: state.tx, ty: state.ty };
  return loadWorld(state.world ? { view: () => saved } : {});
}

async function renderInspectCard(info) {
  if (!info || !info.in_bounds) return;

  state.inspectPoint = { lat: info.lat, lon: info.lon };
  renderCustomOverlays();

  const card = $('inspect-card');
  card.classList.add('open');
  const st = info.settlement || null;

  $('inspect-title').textContent = st
    ? st.name
    : (info.is_ocean ? info.marine_zone : (info.landmass_name || info.biome));
  $('inspect-coords').innerHTML = st
    ? `${escapeHtml(st.tier)} · ${escapeHtml(st.role)} · ${st.lat.toFixed(2)}°, ${st.lon.toFixed(2)}°`
    : `${info.lat.toFixed(2)}°, ${info.lon.toFixed(2)}° · ${escapeHtml(info.biome)}` +
      (info.is_wild ? `<br><span class="wild-pill">Дикие земли: ${escapeHtml(info.wild_reason || 'необжитая зона')}</span>` : '');

  let hydroNote = info.discharge_m3s > 1 ? `${Math.round(info.discharge_m3s)} м³/с (пор. ${info.river_order})` : 'нет';
  if (info.is_delta) hydroNote += ' · дельта';
  else if (info.is_oasis) hydroNote = hydroNote === 'нет' ? 'оазис' : `${hydroNote} · оазис`;
  else if (info.is_wadi) hydroNote = 'вади';
  if (info.nearest_waterfall_drop_m > 0 && info.nearest_waterfall_dist_km <= 140) {
    hydroNote += ` · водопад ${Math.round(info.nearest_waterfall_drop_m)} м`;
  }

  const rows = st ? [
    ...(st.realm ? [['Держава', st.realm]] : []),
    ['Статус', `${st.tier} (инд. ${Math.round(st.population_score)})`],
    ['Специализация', st.role],
    ['Торговые пути', `${st.trade_degree} маршр.`],
    ['Биом и высота', `${info.biome}, ${Math.round(info.elevation_m)} м`],
    ['Сток реки', hydroNote],
  ] : [
    ['Статус земель', info.is_ocean ? 'Акватория' : (info.is_wild ? 'Дикие / опасные' : 'Обжитые земли')],
    ['Высота', `${info.elevation_m > 0 ? '+' : ''}${Math.round(info.elevation_m)} м`],
    ['Порода', info.bedrock],
    ['Климат (ср.)', `${info.temp_c.toFixed(1)} °C (${info.temp_jan_c.toFixed(0)}°/${info.temp_jul_c.toFixed(0)}°)`],
    ['Осадки / ИУ', `${Math.round(info.precip_mm)} мм · ${info.aridity_index.toFixed(2)}`],
    ...(info.permafrost > 0.02 ? [['Мерзлота', `${Math.round(info.permafrost * 100)}%`]] : []),
    ['Сток реки', hydroNote],
    ['Плодородие', `${Math.round(info.soil_fertility * 100)}%`],
    ...(info.realm_name ? [['Держава', info.realm_name]] : []),
    ...(info.nearest_settlement ? [['Ближ. город', `${info.nearest_settlement} (${Math.round(info.nearest_dist_km)} км)`]] : []),
    ...(info.nearest_wild_site ? [['Дикая метка', `${info.nearest_wild_site} (${Math.round(info.nearest_wild_dist_km)} км)`]] : []),
    ...(info.nearest_deposit ? [['Месторожд.', `${info.nearest_deposit} (${Math.round(info.nearest_deposit_dist_km)} км)`]] : []),
  ];
  $('inspect-kv').innerHTML = rows.map(([k, v]) => `<div class="k">${escapeHtml(k)}</div><div class="v">${escapeHtml(v)}</div>`).join('');

  const acts = $('inspect-actions');
  if (st) {
    acts.style.display = 'flex';
    acts.innerHTML = `
      <button id="btn-open-settlement" class="btn-rect primary-soft">Открыть карту поселения</button>
      <button id="btn-zoom-settlement" class="btn-rect">Приблизить</button>
    `;
    $('btn-open-settlement').addEventListener('click', () => openSettlementMapStub(st));
    $('btn-zoom-settlement').addEventListener('click', () => focusOn(st.lat, st.lon, 12));
    $('inspect-res-summary').textContent = 'Ресурсная корзина поселения';
  } else {
    acts.style.display = 'none';
    acts.innerHTML = '';
    $('inspect-res-summary').textContent = 'Ресурсы и полезные ископаемые';
  }

  const rList = st ? [
    ['Пища', st.food_score],
    ['Вода', st.water_score],
    ['Строевой лес', st.timber_score],
    ['Руды / соль', st.mineral_score],
    ['Итого база', st.resource_score],
  ] : [
    ['Железо', info.resources.iron],
    ['Медь/золото', info.resources.copper_gold],
    ['Самоцветы', info.resources.gems_rare],
    ['Уголь', info.resources.coal],
    ['Янтарь / смолы', info.resources.hydrocarbons],
    ['Соль', info.resources.salt],
    ['Строевой лес', info.resources.timber],
    ['Рыба', info.resources.fishery],
  ];
  $('inspect-resources').innerHTML = rList.map(([label, val]) => {
    const pct = Math.round(Math.min(1, Math.max(0, val)) * 100);
    return `<div class="res-bar"><span style="color:var(--muted)">${escapeHtml(label)}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span style="text-align:right">${pct}%</span></div>`;
  }).join('');
}

async function inspectSettlement(idAttr, latAttr, lonAttr) {
  const p = worldParams();
  p.set('mode', state.mode);
  if (idAttr !== '' && idAttr != null) {
    p.set('settlement_id', String(idAttr));
  } else {
    p.set('lat', String(latAttr));
    p.set('lon', String(lonAttr));
  }
  const res = await fetch('/api/inspect?' + p.toString());
  if (!res.ok) return;
  const info = await res.json();
  await renderInspectCard(info);
}

async function inspectPixel(px, py) {
  const p = worldParams();
  p.set('mode', state.mode);
  p.set('px', px.toFixed(2));
  p.set('py', py.toFixed(2));
  const res = await fetch('/api/inspect?' + p.toString());
  if (!res.ok) return;
  const info = await res.json();
  await renderInspectCard(info);
}

function findNearestWaypoint(px, py) {
  const svg = $('map-stage').querySelector('svg');
  const vb = svg && svg.viewBox.baseVal;
  const us = (vb && vb.width ? vb.width : 2200) / 2200;
  const maxDist = 28 * us;
  let best = null;
  let bestDist = maxDist * maxDist;
  for (const w of activeWaypoints()) {
    const pos = projectGeoToCurrentSvg(w.lat, w.lon);
    if (!pos) continue;
    const dx = pos[0] - px;
    const dy = pos[1] - py;
    const d2 = dx * dx + dy * dy;
    if (d2 <= bestDist) {
      bestDist = d2;
      best = w;
    }
  }
  return best;
}

async function handleRoadClick(px, py) {
  const wp = findNearestWaypoint(px, py);
  if (!wp) {
    state.roadHint = state.roadFrom
      ? `От «${state.roadFrom.name}» → выберите подсвеченную точку Б`
      : 'Нажмите на одну из подсвеченных точек на карте';
    updateToolSubbar();
    return;
  }
  if (!state.roadFrom) {
    state.roadFrom = wp;
    state.roadHint = `От «${wp.name}» → выберите точку Б`;
    updateToolSubbar();
    renderCustomOverlays();
    return;
  }
  if (state.roadFrom.id === wp.id) {
    state.roadFrom = null;
    state.roadHint = 'Выберите точку А на карте';
    updateToolSubbar();
    renderCustomOverlays();
    return;
  }
  const from = state.roadFrom;
  const p = worldParams();
  p.set('mode', state.mode);
  p.set('from_lat', from.lat.toFixed(5));
  p.set('from_lon', from.lon.toFixed(5));
  p.set('to_lat', wp.lat.toFixed(5));
  p.set('to_lon', wp.lon.toFixed(5));
  p.set('target_name', wp.name);
  p.set('allow_sea', '1');

  setLoading(true, 'Прокладка маршрута...');
  try {
    const res = await fetch('/api/route_road?' + p.toString());
    if (!res.ok) return;
    const data = await res.json();
    if (!data.ok || !data.geo_pts || data.geo_pts.length < 2) {
      state.roadHint = data.error || 'Маршрут не найден';
      updateToolSubbar();
      return;
    }
    state.customRoads.push({
      id: 'cr-' + (state.customRoads.length + 1),
      cls: state.roadTier,
      is_sea: !!data.is_sea,
      fromName: from.name,
      toName: wp.name,
      lengthKm: Math.round(data.length_km),
      maxElevM: data.max_elev_m,
      geo_pts: data.geo_pts,
    });
    const modeName = data.is_sea ? 'Морской путь' : (state.roadTier === 1 ? 'Тропа' : state.roadTier === 3 ? 'Тракт' : 'Дорога');
    state.roadFrom = wp; // удобно продолжать маршрут цепочкой; Esc отменяет
    state.roadHint = `${modeName}: ${from.name} → ${wp.name} (${Math.round(data.length_km)} км) · дальше?`;
    updateToolSubbar();
    renderCustomOverlays();
  } finally {
    setLoading(false);
  }
}

async function handleMarkerClick(px, py) {
  const p = worldParams();
  p.set('mode', state.mode);
  p.set('px', px.toFixed(2));
  p.set('py', py.toFixed(2));
  const res = await fetch('/api/inspect?' + p.toString());
  if (!res.ok) return;
  const info = await res.json();
  if (!info.in_bounds) return;
  if (info.is_ocean && state.markerKind !== 'geo') {
    alert('Поселение или важное место можно поставить только на суше.');
    return;
  }
  state.markerSeq += 1;
  const typedName = ($('inp-marker-name')?.value || '').trim();
  const defaultTitle = state.markerKind === 'settlement'
    ? `Застава #${state.markerSeq}`
    : (state.markerKind === 'landmark' ? `Урочище #${state.markerSeq}` : `Ориентир #${state.markerSeq}`);
  const subtitle = state.markerKind === 'settlement'
    ? 'Пользовательское поселение'
    : (state.markerKind === 'landmark' ? 'Важное место' : 'Географическая метка');
  state.customMarkers.push({
    id: 'um-' + state.markerSeq,
    kind: state.markerKind,
    subkind: state.markerKind,
    name: typedName || defaultTitle,
    subtitle,
    lat: info.lat,
    lon: info.lon,
  });
  if ($('inp-marker-name')) $('inp-marker-name').value = '';
  updateToolSubbar();
  renderCustomOverlays();
}

function closePopovers() {
  document.querySelectorAll('.popover.open').forEach((el) => el.classList.remove('open'));
}
function togglePopover(id) {
  const target = $(id);
  const willOpen = !target.classList.contains('open');
  closePopovers();
  if (willOpen) target.classList.add('open');
}

function openWorldModal() {
  closePopovers();
  $('modal-backdrop').classList.add('open');
}
function closeWorldModal() {
  $('modal-backdrop').classList.remove('open');
}

function resetCivForNewWorld() {
  state.civ.realms = false;
  state.civ.cities = false;
  state.civ.routes = false;
  state.civ.salt = 0;
  state.customMarkers = [];
  state.customRoads = [];
  state.roadFrom = null;
  state.roadHint = 'Выберите точку А на карте';
  state.inspectPoint = null;
  $('inspect-card').classList.remove('open');
}

function randomSeedName() {
  const words = ['aethel', 'valinor', 'hyperborea', 'roshar', 'talos', 'krynn', 'solaris', 'nordheim', 'vesper', 'thalassa', 'eldor', 'arkadia'];
  return words[Math.floor(Math.random() * words.length)] + '-' + (100 + Math.floor(Math.random() * 900));
}

function zoomStep(factor) {
  const vp = $('viewport').getBoundingClientRect();
  zoomAt(vp.width * 0.5, vp.height * 0.5, factor);
}

function wireEvents() {
  const ranges = [
    ['inp-activity', 'val-activity', (v) => Number(v).toFixed(2)],
    ['inp-water', 'val-water', (v) => Number(v).toFixed(2)],
    ['inp-tilt', 'val-tilt', (v) => Number(v).toFixed(1) + '°'],
    ['inp-solar', 'val-solar', (v) => Number(v).toFixed(1) + '°C'],
    ['inp-rot', 'val-rot', (v) => Number(v).toFixed(2) + '×'],
  ];
  ranges.forEach(([inp, out, fmt]) => {
    $(inp).addEventListener('input', () => { $(out).textContent = fmt($(inp).value); });
  });

  $('btn-reset-earth').onclick = () => {
    $('inp-activity').value = '1.00'; $('val-activity').textContent = '1.00';
    $('inp-water').value = '2.62'; $('val-water').textContent = '2.62';
    $('inp-tilt').value = '23.4'; $('val-tilt').textContent = '23.4°';
    $('inp-solar').value = '0.0'; $('val-solar').textContent = '0.0°C';
    $('inp-rot').value = '1.00'; $('val-rot').textContent = '1.00×';
  };

  $('badge-seed').onclick = openWorldModal;
  $('btn-new-world').onclick = openWorldModal;
  $('btn-modal-close').onclick = closeWorldModal;
  $('btn-modal-cancel').onclick = closeWorldModal;
  $('modal-backdrop').onclick = (e) => { if (e.target === $('modal-backdrop')) closeWorldModal(); };
  $('btn-modal-rand').onclick = () => { $('inp-seed').value = randomSeedName(); };

  $('btn-rand-seed').onclick = () => {
    $('inp-seed').value = randomSeedName();
    resetCivForNewWorld();
    loadWorld();
  };
  $('btn-generate').onclick = () => {
    closeWorldModal();
    resetCivForNewWorld();
    loadWorld();
  };
  $('btn-view-world').onclick = () => { zoomAnim = null; fitToViewport(); };

  // Styles
  for (const s of ['sepia', 'ink', 'color']) {
    $('btn-style-' + s).onclick = () => {
      if (state.style === s) return;
      state.style = s;
      for (const id of ['sepia', 'ink', 'color']) {
        $('btn-style-' + id).classList.toggle('active', id === s);
      }
      reloadCurrent();
    };
  }

  // Popovers
  $('btn-civ-menu').onclick = (e) => { e.stopPropagation(); togglePopover('pop-civ'); };
  $('btn-layers-menu').onclick = (e) => { e.stopPropagation(); togglePopover('pop-layers'); };
  $('btn-export-menu').onclick = (e) => { e.stopPropagation(); togglePopover('pop-export'); };
  document.querySelectorAll('.popover').forEach((el) => el.addEventListener('click', (e) => e.stopPropagation()));
  window.addEventListener('click', closePopovers);

  // Civilization commands
  $('realms-chips').querySelectorAll('button[data-realms]').forEach((b) => {
    b.onclick = () => {
      state.civ.targetRealms = parseInt(b.dataset.realms, 10);
      $('realms-chips').querySelectorAll('button').forEach((x) => x.classList.toggle('active', x === b));
    };
  });
  $('btn-civ-realms').onclick = () => {
    state.civ.realms = true;
    reloadCurrent();
  };
  $('btn-civ-cities').onclick = () => {
    state.civ.cities = true;
    reloadCurrent();
  };
  $('btn-civ-routes').onclick = () => {
    state.civ.cities = true;
    state.civ.routes = true;
    reloadCurrent();
  };
  $('btn-civ-all').onclick = () => {
    state.civ.realms = true;
    state.civ.cities = true;
    state.civ.routes = true;
    reloadCurrent();
  };
  $('btn-civ-reroll').onclick = () => {
    if (!state.civ.realms && !state.civ.cities && !state.civ.routes) {
      state.civ.realms = true;
      state.civ.cities = true;
      state.civ.routes = true;
    }
    state.civ.salt += 1;
    reloadCurrent();
  };
  $('btn-civ-clear').onclick = () => {
    state.civ.realms = false;
    state.civ.cities = false;
    state.civ.routes = false;
    reloadCurrent();
  };

  // Layers & Legend quick toggle
  document.querySelectorAll('input[data-layer]').forEach((cb) => {
    cb.addEventListener('change', applyLayerToggles);
  });
  $('btn-legend-quick').onclick = () => {
    $('chk-legend').checked = !$('chk-legend').checked;
    applyLayerToggles();
  };

  // Dock tools
  $('tool-inspect').onclick = () => setTool('inspect');
  $('tool-road').onclick = () => setTool('road');
  $('tool-marker').onclick = () => setTool('marker');
  $('btn-inspect-close').onclick = () => {
    $('inspect-card').classList.remove('open');
    state.inspectPoint = null;
    renderCustomOverlays();
  };

  // Zoom controls
  $('btn-zoom-in').onclick = () => zoomStep(1.25);
  $('btn-zoom-out').onclick = () => zoomStep(1 / 1.25);
  $('btn-fit').onclick = () => { zoomAnim = null; fitToViewport(); };

  // Pan & Click on viewport
  const vp = $('viewport');
  vp.addEventListener('contextmenu', (e) => e.preventDefault());

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closePopovers();
      closeWorldModal();
      if (state.tool === 'road' && state.roadFrom) {
        state.roadFrom = null;
        state.roadHint = 'Выберите точку А на карте';
        updateToolSubbar();
        renderCustomOverlays();
      }
    }
    if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT') {
      state.spaceDown = true;
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space') state.spaceDown = false;
  });

  vp.addEventListener('mousedown', (e) => {
    if (e.button === 0 || e.button === 1 || e.button === 2) {
      state.panCandidate = true;
      state.dragging = (e.button === 1 || e.button === 2 || state.spaceDown);
      if (state.dragging) vp.classList.add('panning');
      state.downX = state.lastX = e.clientX;
      state.downY = state.lastY = e.clientY;
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (!state.panCandidate) return;
    const dx = e.clientX - state.lastX;
    const dy = e.clientY - state.lastY;
    if (!state.dragging && Math.hypot(e.clientX - state.downX, e.clientY - state.downY) > 4) {
      state.dragging = true;
      vp.classList.add('panning');
    }
    if (state.dragging) {
      state.tx += dx;
      state.ty += dy;
      applyTransform();
    }
    state.lastX = e.clientX;
    state.lastY = e.clientY;
  });

  window.addEventListener('mouseup', (e) => {
    if (!state.panCandidate) return;
    const wasDragging = state.dragging;
    state.panCandidate = false;
    state.dragging = false;
    vp.classList.remove('panning');
    if (wasDragging) {
      return;
    }
    if (e.button === 0 && e.target.closest('#map-stage')) {
      const svg = $('map-stage').querySelector('svg');
      if (!svg) return;
      const rect = svg.getBoundingClientRect();
      const vb = svg.viewBox.baseVal;
      const w = vb && vb.width ? vb.width : rect.width;
      const h = vb && vb.height ? vb.height : rect.height;
      const px = ((e.clientX - rect.left) / rect.width) * w;
      const py = ((e.clientY - rect.top) / rect.height) * h;
      if (state.tool === 'road') {
        handleRoadClick(px, py);
      } else if (state.tool === 'marker') {
        handleMarkerClick(px, py);
      } else {
        const icon = e.target.closest('.settlement-icon');
        if (icon) {
          inspectSettlement(icon.dataset.id, icon.dataset.lat, icon.dataset.lon);
        } else {
          inspectPixel(px, py);
        }
      }
    }
  });

  vp.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = vp.getBoundingClientRect();
    const dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
    zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-Math.max(-200, Math.min(200, dy)) * 0.0022));
  }, { passive: false });

  vp.addEventListener('dblclick', (e) => {
    if (state.tool !== 'inspect' || e.target.closest('.settlement-icon')) return;
    const r = vp.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, 2);
  });

  window.addEventListener('resize', applyTransform);
}

wireEvents();
loadWorld();
</script>
</body>
</html>
