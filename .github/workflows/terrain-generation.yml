name: spherical generation checks
on:
  workflow_dispatch:
  push:
    branches: ['feature/natural-world-v3']
    paths: ['src/**', 'tools/terrain-edit-*.cjs', 'tools/terrain-editor-*.cjs', '.github/workflows/terrain-generation.yml']
concurrency:
  group: terrain-generation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node tools/terrain-edit-tectonics-test.cjs
      - run: node tools/terrain-edit-generation-test.cjs
      - name: Install isolated browser
        run: |
          npm install --prefix "$RUNNER_TEMP/editor-browser" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/editor-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Actual generated worlds in Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/editor-browser/node_modules
        run: node tools/terrain-editor-generation-browser-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-generation-${{ github.sha }}
          path: artifacts/editor-generation
          if-no-files-found: ignore
