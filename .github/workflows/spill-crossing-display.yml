name: spill crossing display checks
on:
  workflow_dispatch:
  push:
    branches: ['feature/natural-world-v3']
    paths:
      - '.github/workflows/spill-crossing-display.yml'
      - 'src/spill-crossing-display.js'
      - 'tools/spill-crossing-display-test.cjs'
permissions:
  contents: read
jobs:
  display:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/spill-crossing-display-test.cjs
