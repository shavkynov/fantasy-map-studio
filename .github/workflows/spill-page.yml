name: TEST .15 spill page checks
on:
  workflow_dispatch:
  push:
    branches: ['feature/natural-world-v3']
    paths:
      - '.github/workflows/spill-page.yml'
      - 'src/drainage-candidate.html'
      - 'src/ab-project-controls.js'
      - 'src/version.js'
      - 'package.json'
      - 'build-mac.command'
      - 'tools/runoff-page-test.cjs'
      - 'tools/ab-project-controls-test.cjs'
permissions:
  contents: read
jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/runoff-page-test.cjs
      - run: node tools/ab-project-controls-test.cjs
      - run: node tools/spill-crossing-display-test.cjs
      - run: node tools/spill-publication-lifecycle-test.cjs
