name: terrain editor page checks
on:
  workflow_dispatch:
  push:
    branches: ['feature/natural-world-v3']
    paths:
      - '.github/workflows/terrain-editor-page.yml'
      - 'src/terrain-edit-core.js'
      - 'src/terrain-edit-session.js'
      - 'src/terrain-editor.html'
      - 'src/terrain-editor-page.js'
      - 'scripts/prepare-contact-page.cjs'
      - 'tools/terrain-edit-core-test.cjs'
      - 'tools/terrain-edit-session-test.cjs'
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Brush geometry, history and edit patch format
        run: node tools/terrain-edit-core-test.cjs
      - name: Real numerical geometry and water lifecycle
        run: node tools/terrain-edit-session-test.cjs
      - name: Preserve TEST .17 contact page contracts
        run: node tools/water-contact-page-test.cjs
