name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.92.0)'
        required: true
        default: 'v0.92.0'
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
            run_tests: true
          - target: x86_64-apple-darwin
            arch: intel
            run_tests: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Determine release version
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Run release test suite (macOS arm64)
        if: matrix.run_tests
        run: RUSTFLAGS="-D warnings" cargo test --release
      - name: Build & package macOS bundle (${{ matrix.arch }})
        run: TARGET="${{ matrix.target }}" VERSION="$VERSION" ./fms-studio/scripts/bundle_macos.sh
      - name: Verify Mach-O architecture
        run: |
          file "Fantasy Map Studio.app/Contents/MacOS/fms-studio"
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-${{ matrix.arch }}
          path: |
            dist/FantasyMapStudio-${{ env.VERSION }}-macos-${{ matrix.arch }}.dmg
            dist/FantasyMapStudio-${{ env.VERSION }}-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Determine release version
        shell: pwsh
        run: |
          $tag = "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          "VERSION=$($tag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test and build Windows x64 native WebView2 binary
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "-D warnings"
          cargo test --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release -p fms-studio
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke-test standalone .exe without assets directory
        shell: pwsh
        run: |
          $smokeDir = Join-Path "dist" "smoke"
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          $smokeExe = Join-Path $smokeDir "FantasyMapStudio.exe"
          Copy-Item "target/release/fms-studio.exe" $smokeExe -Force
          $proc = Start-Process -FilePath $smokeExe -ArgumentList "--web","--port","17878" -WorkingDirectory $smokeDir -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 300
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:17878/" -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw "Standalone Windows exe failed to serve / without assets directory" }
            $api = Invoke-WebRequest -Uri "http://127.0.0.1:17878/api/world?w=180" -UseBasicParsing -TimeoutSec 30
            if ($api.StatusCode -ne 200 -or $api.Content -notmatch '"seed"') {
              throw "Standalone Windows exe failed /api/world check"
            }
            Write-Host "Standalone Windows smoke test passed (HTTP 200 + world JSON OK)"
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Package standalone Windows x64 .exe and .zip
        shell: pwsh
        run: |
          $ver = $env:VERSION
          $pkgName = "FantasyMapStudio-$ver-windows-x64"
          $exeDist = "dist/$pkgName.exe"
          Copy-Item "target/release/fms-studio.exe" $exeDist -Force

          $stage = Join-Path "dist/stage" $pkgName
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/fms-studio.exe" (Join-Path $stage "FantasyMapStudio.exe") -Force
          @"
          Fantasy Map Studio v$ver (Windows x64)

          Launch:
            Run FantasyMapStudio.exe — opens as a native Windows desktop window (WebView2, no browser tab or console window).
            Requires Microsoft Edge WebView2 Runtime (preinstalled on Windows 11 and modern Windows 10).

          Optional CLI / headless web server mode:
            FantasyMapStudio.exe --web --port 7878
          "@ | Set-Content -Path (Join-Path $stage "README.txt") -Encoding UTF8
          $zipPath = "dist/$pkgName.zip"
          Compress-Archive -Path $stage -DestinationPath $zipPath -Force
          Get-ChildItem dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-x64
          path: |
            dist/FantasyMapStudio-${{ env.VERSION }}-windows-x64.exe
            dist/FantasyMapStudio-${{ env.VERSION }}-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Determine release version
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Test and build Linux x64 binary
        run: |
          RUSTFLAGS="-D warnings" cargo test --release
          RUSTFLAGS="-D warnings" cargo build --release -p fms-studio
          strip target/release/fms-studio
      - name: Package Linux x64 tar.gz
        run: |
          PKG="FantasyMapStudio-${VERSION}-linux-x64"
          STAGE="dist/stage/${PKG}"
          mkdir -p "$STAGE"
          cp target/release/fms-studio "$STAGE/fms-studio"
          chmod +x "$STAGE/fms-studio"
          cat > "$STAGE/run-studio.sh" << 'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec "$(cd "$(dirname "$0")" && pwd)/fms-studio" "$@"
          SH
          chmod +x "$STAGE/run-studio.sh"
          cat > "$STAGE/README.txt" << TXT
          Fantasy Map Studio v${VERSION} (Linux x64)

          Launch:
            ./run-studio.sh   (starts local studio and opens default browser)

          CLI options:
            ./fms-studio --web --port 7878
            ./fms-studio --no-browser
          TXT
          tar -C dist/stage -czf "dist/${PKG}.tar.gz" "${PKG}"
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-x64
          path: dist/FantasyMapStudio-${{ env.VERSION }}-linux-x64.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS & Release notes
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          (cd release-artifacts && sha256sum * > SHA256SUMS.txt)
          ls -lh release-artifacts/
          cat > release-notes.md << EOF
          # Fantasy Map Studio ${TAG}

          ## Исправления и улучшения в ${TAG}
          - **Разнообразие материков и сферическая тектоника:** исправлен режим \`Авто (1–5)\`, убраны запретная зона на ±180° и горизонтальный «ножевой срез» на 58–68°, добавлены асимметрия размеров материков и фрактальное искривление границ плит Вороного, разброс точек переведён на касательный базис сферы, а сглаживания — на широтную компенсацию и переход через полюса.
          - **Физика, гидрология и биомы:** добавлены ограничения высоты для пойменных болот (\`Biome::Wetland\`), сферическое поле долин в \`region.rs\` (без параллельной «расчёски» прибрежных рек) и плавная склейка аридности.
          - **Расселение, границы и ресурсы:** кнопка «Перемешать» (\`civ_salt\`) реально перестраивает города, столицы и границы; добавлены материковая квота поселений, достройка локальных деревень/рудников/застав в регионах, естественные границы по крупным рекам и хребтам, сухопутные месторождения («Смолы, янтарь и битум»), а также запрет высадки торговых морских путей на дикие пляжи и проезда дорог по озёрам.
          - **Рендерер, сервер и интерфейс:** убрана жёсткая уравниловка гор \`fit_share\`, сохранена естественная форма озёр, синхронизированы береговой контур, легенда и палитра держав; \`/api/inspect\` в режиме региона читает детальную сетку; добавлен тост-уведомление в \`index.html\`, исправлена передача \`scale\` при зуме к поселению, добавлено экранирование \`escapeHtml\`, а \`full_png\`/\`standalone_svg\` формируются лениво по запросу.

          ## Основные возможности
          - **Классическое оформление «от руки» (линейка 0.89.0):** три стиля (\`Сепия\`, \`Ч/Б\`, \`Цветной\`), северо-западная светотень, деликатные горизонтали рельефа и увалы на внутренних равнинах без визуального шума.
          - **Минималистичный интерфейс:** генерация стран, городов и торговых путей по команде, кликабельные иконки поселений без цветных кругов, карточка поселения и зум в окрестности (\`4×\`).
          - **Ресурсная география и маршруты:** иерархия поселений, стоянки охотников и руины в диких биомах, офшорные морские трассы и конструктор дорог «от точки до точки».

          ## Сборки по платформам
          - **macOS (Apple Silicon arm64):** \`FantasyMapStudio-${VERSION}-macos-arm64.dmg\` / \`.zip\`
          - **macOS (Intel x86_64):** \`FantasyMapStudio-${VERSION}-macos-intel.dmg\` / \`.zip\`
          - **Windows (x64):** \`FantasyMapStudio-${VERSION}-windows-x64.exe\` (единый файл) или \`FantasyMapStudio-${VERSION}-windows-x64.zip\` (отдельное окно WebView2, требует WebView2 Runtime — встроен в Windows 10/11)
          - **Linux (x64):** \`FantasyMapStudio-${VERSION}-linux-x64.tar.gz\` (\`./run-studio.sh\`)
          EOF
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-artifacts/* --clobber
            gh release edit "$TAG" --title "Fantasy Map Studio ${TAG}" --notes-file release-notes.md --draft=false --latest
          else
            gh release create "$TAG" release-artifacts/* --title "Fantasy Map Studio ${TAG}" --notes-file release-notes.md --latest
          fi
